<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

  <title>COSMOS — Universe Explorer</title>
  <meta name="description"
        content="Interactive 3D universe explorer">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app"></div>

<div id="loading">
  <div class="loader"></div>
  <div class="loading-logo">C O S M O S</div>
  <div class="loading-text">ENTERING DEEP SPACE</div>
</div>

<header class="topbar">

  <div class="brand">
    <div class="brand-title">C O S M O S</div>
    <div class="brand-subtitle">LIVE UNIVERSE EXPLORER</div>
  </div>

  <div class="actions">
    <button id="presentBtn">PRESENT</button>
    <button id="searchBtn">SEARCH</button>
  </div>

</header>


<div id="searchPanel" class="panel search-panel hidden">

  <div class="caption">SEARCH UNIVERSE</div>

  <div class="search-row">
    <input
      id="searchInput"
      type="search"
      placeholder="Galaxy, planet..."
    >
    <button id="searchGo">GO</button>
  </div>

  <div id="searchResults"></div>

</div>


<div id="objectPanel" class="panel object-panel hidden">

  <button id="closeObject" class="close">×</button>

  <div class="caption">ASTRONOMICAL OBJECT</div>

  <h2 id="objectName">Galaxy</h2>

  <p id="objectDescription"></p>

  <div class="metadata">

    <div>
      <span>TYPE</span>
      <strong id="objectType"></strong>
    </div>

    <div>
      <span>STATUS</span>
      <strong id="objectStatus"></strong>
    </div>

  </div>

</div>


<div class="bottom-ui">

  <div class="panel scale-panel">

    <div class="caption">SCALE</div>

    <input
      id="scaleSlider"
      type="range"
      min="0"
      max="100"
      value="0"
    >

    <div class="scale-labels">
      <span>UNIVERSE</span>
      <strong id="scaleText">DEEP UNIVERSE</strong>
      <span>STREET</span>
    </div>

  </div>


  <div class="panel time-panel">

    <div class="caption">ASTRONOMICAL TIME</div>

    <div id="timeDisplay">--</div>

    <input
      id="dateInput"
      type="datetime-local"
    >

    <div class="time-buttons">

      <button id="previousDay">− DAY</button>
      <button id="nextDay">+ DAY</button>

    </div>

  </div>

</div>


<div id="navigation">

  <span class="desktop">
    DRAG TO ROTATE · SCROLL TO ZOOM · RIGHT DRAG TO PAN
  </span>

  <span class="mobile">
    DRAG TO ROTATE · PINCH TO ZOOM
  </span>

</div>


<script type="module" src="app.js"></script>

</body>
</html>
