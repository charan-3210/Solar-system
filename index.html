<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>COSMOS — 3D Universe Explorer</title>

<meta name="theme-color" content="#02040a">
<meta name="description"
      content="COSMOS interactive 3D universe and solar system explorer.">

<link rel="stylesheet" href="./style.css">

<link rel="modulepreload" href="./vendor/three.module.js">

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/"
  }
}
</script>
</head>

<body>

<div id="app">

  <canvas id="space"></canvas>

  <header class="topbar">
    <div class="brand">
      <div class="brand-title">COSMOS</div>
      <div class="brand-sub">UNIVERSE EXPLORER</div>
    </div>

    <div class="top-actions">
      <button id="presentBtn">PRESENT</button>
      <button id="searchBtn">SEARCH</button>
    </div>
  </header>

  <div id="searchPanel" class="panel search-panel hidden">
    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      placeholder="Search planet, moon, galaxy..."
    >
    <div id="searchResults"></div>
  </div>

  <aside id="infoPanel" class="panel info-panel hidden">
    <button id="closeInfo" class="close">×</button>
    <div id="infoContent"></div>
  </aside>

  <div class="scale-control">
    <button data-scale="system">SYSTEM</button>
    <button data-scale="galaxy">GALAXY</button>
    <button data-scale="universe">UNIVERSE</button>
  </div>

  <div class="time-panel">
    <div class="time-title">TIME</div>

    <input id="dateInput" type="datetime-local">

    <div class="time-actions">
      <button id="pastBtn">− 1 YEAR</button>
      <button id="nowBtn">PRESENT</button>
      <button id="futureBtn">+ 1 YEAR</button>
    </div>

    <div id="timeReadout"></div>
  </div>

  <div id="status">
    <span class="status-dot"></span>
    <span id="statusText">COSMOS READY</span>
  </div>

</div>

<script type="module" src="./app.js"></script>

</body>
</html>
