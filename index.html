<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
  >

  <title>COSMOS — Universe Explorer</title>

  <meta
    name="description"
    content="COSMOS is an interactive 3D universe explorer."
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app"></div>

<!-- Loading screen -->
<div id="loading">
  <div class="loading-core"></div>

  <div class="loading-title">
    COSMOS
  </div>

  <div class="loading-sub">
    INITIALIZING DEEP SPACE
  </div>
</div>

<!-- Top -->
<header class="topbar">

  <div class="logo">
    <div class="logo-main">C O S M O S</div>
    <div class="logo-sub">
      LIVE UNIVERSE EXPLORER
    </div>
  </div>

  <div class="actions">
    <button id="presentBtn">PRESENT</button>
    <button id="searchBtn">SEARCH</button>
  </div>

</header>


<!-- Search -->
<div id="searchPanel" class="glass search-panel hidden">

  <div class="panel-caption">
    SEARCH UNIVERSE
  </div>

  <div class="search-row">

    <input
      id="searchInput"
      type="search"
      placeholder="Search galaxy, planet..."
    >

    <button id="searchGo">
      GO
    </button>

  </div>

  <div id="searchResults"></div>

</div>


<!-- Object information -->
<div id="objectPanel" class="glass object-panel hidden">

  <button
    id="closeObject"
    class="close"
  >
    ×
  </button>

  <div
    id="objectCategory"
    class="panel-caption"
  >
    GALAXY
  </div>

  <h2 id="objectName">
    Andromeda Galaxy
  </h2>

  <p id="objectDescription"></p>

  <div class="metadata">

    <div>
      <span>TYPE</span>
      <strong id="objectType"></strong>
    </div>

    <div>
      <span>STATUS</span>
      <strong id="objectStatus"></strong>
    </div>

  </div>

</div>


<!-- Bottom interface -->
<div class="bottom">

  <!-- Scale -->
  <div class="glass scale-box">

    <div class="panel-caption">
      SCALE
    </div>

    <input
      id="scaleSlider"
      type="range"
      min="0"
      max="100"
      value="0"
    >

    <div class="scale-info">

      <span>UNIVERSE</span>

      <strong id="scaleText">
        DEEP UNIVERSE
      </strong>

      <span>STREET</span>

    </div>

  </div>


  <!-- Time -->
  <div class="glass time-box">

    <div class="panel-caption">
      ASTRONOMICAL TIME
    </div>

    <div id="timeDisplay">
      --
    </div>

    <input
      id="dateInput"
      type="datetime-local"
    >

    <div class="time-buttons">

      <button id="previousDay">
        − DAY
      </button>

      <button id="nextDay">
        + DAY
      </button>

    </div>

  </div>

</div>


<!-- Navigation -->
<div id="navigation">

  <span class="desktop-navigation">
    DRAG ROTATE&nbsp;&nbsp; · &nbsp;&nbsp;SCROLL ZOOM&nbsp;&nbsp; · &nbsp;&nbsp;RIGHT DRAG PAN
  </span>

  <span class="mobile-navigation">
    DRAG ROTATE&nbsp;&nbsp; · &nbsp;&nbsp;PINCH ZOOM
  </span>

</div>


<script type="module" src="app.js"></script>

</body>
</html>
