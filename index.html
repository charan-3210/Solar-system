<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cosmos Live</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app"></div>

<div id="loading">
    <div class="loading-ring"></div>
    <strong>COSMOS LIVE</strong>
    <small>Initializing 3D universe</small>
</div>

<header>
    <div>
        <div class="logo">COSMOS</div>
        <div class="subtitle">LIVE UNIVERSE EXPLORER</div>
    </div>

    <div class="actions">
        <button id="present">PRESENT</button>
        <button id="searchButton">SEARCH</button>
    </div>
</header>

<div id="searchPanel" class="panel hidden">
    <div class="panelTitle">
        SEARCH COSMOS
        <button id="closeSearch">×</button>
    </div>

    <input id="searchInput"
           placeholder="Earth, Mars, Andromeda, TRAPPIST-1...">

    <div id="results"></div>
</div>

<div id="objectPanel" class="panel hidden">
    <button id="closeObject" class="close">×</button>

    <small id="objectType">ASTRONOMICAL OBJECT</small>

    <h2 id="objectName">Earth</h2>

    <p id="objectDescription"></p>

    <div class="objectGrid">
        <div>
            <span>TYPE</span>
            <b id="objectDataType"></b>
        </div>

        <div>
            <span>STATUS</span>
            <b id="objectStatus"></b>
        </div>

        <div>
            <span>SCALE</span>
            <b id="objectScale"></b>
        </div>
    </div>
</div>

<div class="bottom">

    <div class="timeBox">

        <small>ASTRONOMICAL TIME</small>

        <strong id="timeText">PRESENT</strong>

        <input id="date"
               type="datetime-local">

        <div class="timeButtons">
            <button id="previous">− DAY</button>
            <button id="next">+ DAY</button>
        </div>

    </div>

    <div class="scaleBox">

        <small>SCALE</small>

        <input id="scale"
               type="range"
               min="0"
               max="7"
               step="1"
               value="4">

        <div class="scaleLabels">
            <span>UNIVERSE</span>
            <b id="scaleText">SOLAR SYSTEM</b>
            <span>STREET</span>
        </div>

    </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
